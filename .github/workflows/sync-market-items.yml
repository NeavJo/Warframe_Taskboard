name: Sync Market Items

on:
  schedule:
    # 每天 UTC 6:00 运行（北京时间 14:00）
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data

      - name: Download market items from WM API
        run: |
          curl -sSL \
            -H "Language: zh-hans" \
            -H "Platform: pc" \
            -o data/wf_market_items.json \
            https://api.warframe.market/v2/items

      - name: Verify JSON
        run: |
          if ! jq '.data | length > 0' data/wf_market_items.json 2>/dev/null; then
            echo "ERROR: items.json is invalid or empty"
            exit 1
          fi
          echo "OK: $(jq '.data | length' data/wf_market_items.json) items loaded"
          echo "Size: $(wc -c < data/wf_market_items.json) bytes"

      - name: Download missing item images
        run: python .github/scripts/download_market_images.py

      - name: Check for changes
        id: changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "chore: sync market items [skip ci]

          Auto-synced from api.warframe.market on $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
